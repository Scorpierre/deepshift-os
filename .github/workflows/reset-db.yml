name: Reset DB (prod)

on:
  workflow_dispatch:

jobs:
  reset:
    name: Truncate all tables
    runs-on: ubuntu-latest
    steps:
      - name: SSH & truncate
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker run --rm postgres:16-alpine \
              psql 'postgresql://deepshift:DeepShift2026!@10.0.1.4:5432/deepshift_db' \
              -c 'TRUNCATE "Prospect" CASCADE;'
            echo "✅ DB cleared at $(date)"
