name: Deploy to VM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy → deepshift-vm
    runs-on: ubuntu-latest

    steps:
      - name: Write .env.production on VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cat > /opt/deepshift/repo/app/web/.env.production << 'ENVEOF'
            ${{ secrets.ENV_PRODUCTION }}
            ENVEOF

      - name: SSH & deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/deepshift/repo
            git pull origin main
            cd app/web
            npm install
            DATABASE_URL='${{ secrets.DATABASE_URL }}' npx prisma db push
            docker compose build --no-cache
            docker compose up -d
            echo "✅ Deploy done at $(date)"
