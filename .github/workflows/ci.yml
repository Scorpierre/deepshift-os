name: CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  quality:
    name: Type-check · Lint · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
