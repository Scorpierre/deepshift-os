services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: deepshift
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: deepshift
    volumes:
      - deepshift_pgdata:/var/lib/postgresql/data

volumes:
  deepshift_pgdata:
